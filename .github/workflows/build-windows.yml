name: Windows installer

# Cross-building a native module from macOS works but is easy to get subtly
# wrong — the binary architecture has to be patched into every copy pnpm keeps.
# On a Windows runner the module is simply built for the machine it runs on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A v* tag publishes the installer to the GitHub release of that tag, which is
# where installed counters look for updates (packages/desktop/src/updates.ts).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tag, packages/desktop/package.json and CHANGELOG.md must agree, or the
      # shops would be offered an update with the wrong number or no notes.
      - name: Check version and release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: pnpm exec tsx tools/release.ts notes "${GITHUB_REF_NAME}" > release-notes.md
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Build native module for Electron
        run: pnpm --filter @pos/desktop native:electron
      # dist/ is gitignored, so the runner has to build the app (admin UI,
      # main.cjs, migrations) before packaging it.
      - name: Build app
        run: pnpm --filter @pos/desktop build
      - name: Build installer
        run: pnpm --filter @pos/desktop exec electron-builder --win --publish never
      # The packaged native module must be a Windows binary. The build log
      # looks identical either way, so check the file itself.
      - name: Check packaged native module
        shell: bash
        run: |
          f=$(find packages/desktop/release/win-unpacked -name better_sqlite3.node | head -1)
          test -n "$f" || { echo "better_sqlite3.node missing from the package"; exit 1; }
          head -c 2 "$f" | grep -q MZ || { echo "$f is not a Windows binary"; exit 1; }
          echo "ok: $f is a Windows binary"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packages/desktop/release/*.exe
          retention-days: 30
      # latest.yml tells installed counters there is a new version; the .blockmap
      # lets them download only the parts that changed.
      - name: Publish to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The APK workflow may have made the release already.
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag ||
            gh release view "$tag" >/dev/null
          cd packages/desktop/release
          gh release upload "$tag" *.exe *.exe.blockmap latest.yml --clobber
