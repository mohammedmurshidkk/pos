name: Android APK

# A React Native release build needs several GB of free disk for the Gradle
# cache and NDK artifacts. A CI runner has that; a working laptop often does not.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A v* tag attaches the APK to the GitHub release of that tag. Counters download
# it from there and hand it to their tablets (packages/desktop/src/updates.ts).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The default package list includes the long-removed `tools` package, which
      # makes current sdkmanager fail ("Failed to find package 'tools'").
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: pnpm install --frozen-lockfile
      - name: Check version and release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm exec tsx tools/release.ts notes "${GITHUB_REF_NAME}" > release-notes.md
      - run: pnpm --filter @pos/mobile exec expo prebuild --platform android --clean
      - name: Build release APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: waiter-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      # Every build is signed with the same key (prebuild's debug.keystore), which
      # is what lets the new APK install over the old one on the tablet.
      - name: Publish to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(node -p "require('./packages/desktop/package.json').version")
          name=$(node -p "require('./brand/brand.json').updates.tabletApkFileName")
          cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk "$name-$version.apk"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag ||
            gh release view "$tag" >/dev/null
          gh release upload "$tag" "$name-$version.apk" --clobber
